<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operador – Sistema de Turnos</title>
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .navbar-custom { background: #14532d; }
    .card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .turno-card { border-radius: 12px; border: 2px solid #dee2e6; background: white; padding: 16px 20px; margin-bottom: 12px; transition: border-color .2s, box-shadow .2s; }
    .turno-card.esperando { border-left: 5px solid #ffc107; }
    .turno-card.llamado   { border-left: 5px solid #f59e0b; background: #fffbeb; }
    .turno-card.jugando   { border-left: 5px solid #0d6efd; background: #f0f6ff; }
    .turno-card.nuevo-highlight { animation: highlight .8s ease; }
    @keyframes highlight { 0% { box-shadow: 0 0 0 4px rgba(13,110,253,0.4); } 100% { box-shadow: none; } }

    .biper-num { font-size: 2rem; font-weight: 900; color: #0d1b4b; line-height: 1; }
    .atraccion-tag { font-size: .8rem; background: #e8f4fd; color: #0a58ca; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .duracion-tag  { font-size: .78rem; background: #ede9fe; color: #5b21b6; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
    .hora-tag      { font-size: .78rem; color: #6c757d; }

    /* Timer de tiempo en juego */
    .timer-badge {
      font-size: .78rem; font-weight: 600;
      background: #dcfce7; color: #166534;
      padding: 3px 10px; border-radius: 20px;
    }
    .timer-badge.timer-vencido {
      background: #fee2e2; color: #991b1b;
      animation: blink 1.5s ease infinite;
    }
    .timer-countdown {
      background: #fef3c7; color: #92400e;
      font-weight: 700;
      animation: pulse 1s ease infinite;
    }
    @keyframes blink  { 0%,100% { opacity:1; } 50% { opacity:.6; } }
    @keyframes pulse  { 0%,100% { opacity:1; } 50% { opacity:.75; } }

    /* Etapas en tarjetas de operador */
    .etapa-info { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
    .etapa-actual {
      font-size: .8rem; font-weight: 600;
      background: #dbeafe; color: #1d4ed8;
      padding: 3px 10px; border-radius: 20px;
    }
    .etapa-sig {
      font-size: .78rem; color: #6b7280;
    }

    /* Cola de espera: alto fijo (~5 turnos) con scroll interno, no crece con la cantidad de turnos */
    #listaEsperando {
      max-height: 690px;
      overflow-y: auto;
      padding-right: 6px;
    }
    #listaEsperando::-webkit-scrollbar { width: 8px; }
    #listaEsperando::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .puesto-badge { background: rgba(255,255,255,.15); color: #fff; font-size: .8rem; font-weight: 600; padding: 5px 10px; border-radius: 20px; white-space: nowrap; }
    .etapa-opcion { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
    .etapa-opcion:has(input:checked) { border-color: #16a34a; background: #f0fdf4; }
    .etapa-opcion input { width: 1.3rem; height: 1.3rem; margin: 0; }
    .etapa-opcion.ocupada { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3">
  <span class="navbar-brand fw-bold fs-5">
    <i class="bi bi-person-gear me-2"></i>Operador
  </span>
  <div class="d-flex align-items-center gap-2">
    <span class="text-white-50 small" id="usuarioNombre"></span>
    <!-- Etapa(s) a cargo del operador; se completa desde JS -->
    <span class="puesto-badge d-none" id="puestoActual"></span>
    <button class="btn btn-outline-light btn-sm d-none" id="btnCambiarPuesto">
      <i class="bi bi-arrow-left-right me-1"></i>Cambiar etapa
    </button>
    <!-- Visible solo si tiene permiso_gestionar_juegos (se activa desde JS) -->
    <a href="/juegos.html" class="btn btn-outline-light btn-sm" id="btnJuegos" style="display:none">
      <i class="bi bi-controller me-1"></i>Juegos
    </a>
    <button class="btn btn-outline-light btn-sm" id="btnLogout">
      <i class="bi bi-box-arrow-right me-1"></i>Salir
    </button>
  </div>
</nav>

<div class="container-fluid px-4 mt-4">

  <div class="row g-3 mb-4 align-items-center">
    <div class="col-auto">
      <label class="form-label fw-semibold mb-1" for="filtroAtraccion">Atracción</label>
      <select class="form-select form-select-lg" id="filtroAtraccion" style="max-width:280px">
        <option value="">Todas las atracciones</option>
      </select>
    </div>
    <div class="col">
      <div class="d-flex gap-3 mt-3">
        <div class="card px-4 py-2 text-center">
          <div class="fw-bold fs-4 text-warning mb-0" id="cntEsperando">0</div>
          <div class="text-muted small">Esperando</div>
        </div>
        <div class="card px-4 py-2 text-center">
          <div class="fw-bold fs-4 text-primary mb-0" id="cntLlamado">0</div>
          <div class="text-muted small">Llamados</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card p-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-hourglass-split me-2 text-warning"></i>En Cola</h5>
        <div id="listaEsperando">
          <p class="text-center text-muted py-4">
            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>Sin turnos en espera
          </p>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card p-4">
        <h5 class="fw-bold mb-3"><i class="bi bi-bell-fill me-2 text-primary"></i>En Juego</h5>
        <div id="listaLlamados">
          <p class="text-center text-muted py-4">
            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>Ningún turno llamado
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<!-- Elección de puesto: qué etapa(s) tiene a cargo el operador -->
<div class="modal fade" id="modalPuesto" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold"><i class="bi bi-person-badge me-2 text-success"></i>¿De qué etapa te vas a encargar?</h5>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3" id="puestoJuego"></p>
        <div id="puestoEtapas"></div>
        <p class="text-muted small mb-0 mt-2">
          <i class="bi bi-info-circle me-1"></i>Las demoras de las etapas que elijas se te van a contar a vos mientras las tengas a cargo.
        </p>
        <div class="alert alert-danger small mt-3 mb-0 d-none" id="puestoError"></div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <!-- Solo al cambiar de etapa: al entrar es obligatorio elegir -->
        <button class="btn btn-secondary d-none" id="btnCancelarPuesto" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success px-4" id="btnConfirmarPuesto">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/bootstrap.bundle.min.js"></script>
<script src="/js/operador.js"></script>
</body>
</html>
