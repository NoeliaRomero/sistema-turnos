<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cola de Turnos – Pantalla Pública</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #05091f;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { font-size:1.2rem; font-weight:700; color:rgba(255,255,255,0.9); letter-spacing:2px; text-transform:uppercase; }
    .clock { font-size:1.4rem; font-weight:600; color:rgba(255,255,255,0.6); font-variant-numeric:tabular-nums; }

    /* ── Filtro juegos ── */
    .filtros {
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 10px 32px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }
    .filtro-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .filtro-btn.activo {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    /* ── Contenido principal ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    /* ── Columna JUGANDO ── */
    .col-jugando {
      border-right: 1px solid rgba(255,255,255,0.07);
      overflow-y: auto;
      padding: 24px 28px;
    }
    .col-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .col-title .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      animation: blink-dot 1.2s ease infinite;
    }
    .dot-azul  { background: #3b82f6; }
    .dot-verde { background: #10b981; }
    @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Tarjeta jugando */
    .card-jugando {
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      border-left: 4px solid #3b82f6;
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 14px;
    }
    .juego-label {
      font-size: .75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #93c5fd;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .biper-grande { font-size: 3.5rem; font-weight: 900; line-height: 1; color: #60a5fa; }
    .familia-nombre { font-size: 1.5rem; font-weight: 700; margin: 6px 0 4px; }
    .info-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; }
    .tag-miembros { font-size:.8rem; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.8); padding:3px 12px; border-radius:20px; }
    .etapa-tv { display:flex; align-items:center; gap:10px; margin: 6px 0 4px; flex-wrap:wrap; }
    .etapa-tv-actual { font-size:.85rem; font-weight:700; background:rgba(99,179,237,0.25); color:#90cdf4; padding:3px 12px; border-radius:20px; }
    .etapa-tv-sig    { font-size:.78rem; color:rgba(255,255,255,.45); }
    .progreso-wrap { margin-top: 12px; }
    .progreso-label { font-size:.75rem; color:rgba(255,255,255,.5); margin-bottom:4px; display:flex; justify-content:space-between; }
    .progreso-bar { background: rgba(255,255,255,0.1); border-radius:10px; height:8px; overflow:hidden; }
    .progreso-fill { background: #3b82f6; height:100%; border-radius:10px; transition: width 1s; }
    .progreso-fill.vencido { background: #ef4444; }

    /* ── Columna COLA ── */
    .col-cola {
      overflow-y: auto;
      padding: 24px 28px;
    }

    /* Fila de cola */
    .card-cola {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: background .2s;
    }
    .card-cola:hover { background: rgba(255,255,255,0.07); }
    .card-cola.proximo {
      background: rgba(16,185,129,0.12);
      border-color: rgba(16,185,129,0.3);
      border-left: 4px solid #10b981;
    }
    .posicion { font-size:1.4rem; font-weight:900; color:rgba(255,255,255,0.3); min-width:32px; }
    .card-cola.proximo .posicion { color: #34d399; }
    .biper-col { font-size:1.8rem; font-weight:900; color:rgba(255,255,255,0.9); min-width:60px; text-align:center; }
    .familia-col { flex:1; margin: 0 16px; }
    .familia-col .nombre { font-size:1.15rem; font-weight:700; }
    .familia-col .sub    { font-size:.8rem; color:rgba(255,255,255,.5); margin-top:2px; }
    .espera-col { text-align:right; }
    .espera-num {
      font-size:1.5rem; font-weight:900;
      color: #fbbf24;
    }
    .espera-col.proximo .espera-num { color: #34d399; font-size:1.2rem; }
    .espera-label { font-size:.7rem; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:1px; }

    /* Juego separador en cola */
    .juego-sep {
      font-size:.75rem; font-weight:700; letter-spacing:3px; text-transform:uppercase;
      color: rgba(255,255,255,0.3);
      padding: 14px 0 6px;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 8px;
    }
    .juego-sep:first-child { border-top:none; margin-top:0; padding-top:0; }

    /* Sin datos */
    .sin-datos {
      text-align: center;
      color: rgba(255,255,255,0.2);
      padding: 60px 20px;
    }
    .sin-datos i { font-size: 4rem; display:block; margin-bottom:16px; }

    /* Flash */
    #flash {
      pointer-events:none; position:fixed; inset:0;
      background:rgba(59,130,246,0.15); opacity:0;
      transition:opacity .2s; z-index:999;
    }
    #flash.show { opacity:1; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:4px; }
  </style>
</head>
<body>
<div id="flash"></div>

<header>
  <div class="brand">Cola de Turnos</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="filtros" id="filtros">
  <span style="color:rgba(255,255,255,.4); font-size:.8rem; text-transform:uppercase; letter-spacing:1px;">Filtrar:</span>
  <button class="filtro-btn activo" data-id="">Todos los juegos</button>
</div>

<main>
  <div class="col-jugando">
    <div class="col-title">
      <span class="dot dot-azul"></span>
      Jugando ahora
    </div>
    <div id="listaJugando">
      <div class="sin-datos"><i>🎮</i>Sin grupos jugando</div>
    </div>
  </div>

  <div class="col-cola">
    <div class="col-title">
      <span class="dot dot-verde"></span>
      En espera
    </div>
    <div id="listaCola">
      <div class="sin-datos"><i>⏳</i>Sin grupos en espera</div>
    </div>
  </div>
</main>

<link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="/js/cola.js"></script>
</body>
</html>
