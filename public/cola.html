<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cola de Turnos – Pantalla Pública</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    /* Base pensada para un TV de 55" visto a varios metros de distancia. */
    html { font-size: 20px; }

    body {
      background: #060a1c;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Fondo decorativo: franjas diagonales tenues en las esquinas ──────── */
    body::before, body::after {
      content: '';
      position: fixed;
      width: 60vw;
      height: 60vh;
      pointer-events: none;
      z-index: 0;
      opacity: .5;
    }
    body::before {
      left: -10vw; bottom: -20vh;
      background: linear-gradient(115deg, transparent 40%, rgba(59,130,246,.16) 46%, transparent 52%),
                  linear-gradient(115deg, transparent 55%, rgba(168,85,247,.14) 60%, transparent 66%);
    }
    body::after {
      right: -10vw; bottom: -20vh;
      background: linear-gradient(245deg, transparent 40%, rgba(249,115,22,.14) 46%, transparent 52%),
                  linear-gradient(245deg, transparent 55%, rgba(236,72,153,.12) 60%, transparent 66%);
    }
    header, .filtros, main, footer { position: relative; z-index: 1; }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      padding: 20px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .marca { display:flex; align-items:center; gap:14px; }
    .marca-icono {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .marca-nombre { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; color: rgba(255,255,255,.92); line-height:1.15; }

    .titulo-central { text-align: center; flex: 1; }
    .titulo-central h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }
    .titulo-central .subtitulo {
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #60a5fa;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .reloj-wrap { display:flex; align-items:center; gap:12px; }
    .reloj-wrap i { font-size: 1.6rem; color: rgba(255,255,255,.4); }
    .clock { font-size: 1.9rem; font-weight: 700; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }

    /* ── Filtro juegos ── */
    .filtros {
      padding: 14px 36px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .filtros .etiqueta { color:rgba(255,255,255,.4); font-size:.85rem; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; }
    .filtro-btn {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      padding: 9px 22px;
      border-radius: 26px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .filtro-btn i { font-size: 1.1rem; }
    .filtro-btn.activo {
      background: var(--jc-accent, #3b82f6);
      border-color: var(--jc-accent, #3b82f6);
      color: white;
      box-shadow: 0 4px 16px -4px var(--jc-accent, #3b82f6);
    }

    /* ── Contenido principal ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .col-jugando, .col-cola { overflow-y: auto; padding: 26px 32px; }
    .col-jugando { border-right: 1px solid rgba(255,255,255,0.08); }

    .col-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .col-title .dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      animation: blink-dot 1.2s ease infinite;
    }
    .dot-azul  { background: #3b82f6; box-shadow: 0 0 12px #3b82f6; }
    .dot-verde { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
    @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* Grilla de tarjetas "jugando ahora" */
    .grid-jugando {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    /* Tarjeta jugando — coloreada según --jc-* seteadas inline por juego */
    .card-jugando {
      position: relative;
      overflow: hidden;
      background: var(--jc-bg, rgba(59,130,246,0.1));
      border: 1.5px solid var(--jc-border, rgba(59,130,246,0.3));
      border-radius: 18px;
      padding: 20px 22px;
    }
    .card-jugando .icono-fondo {
      position: absolute;
      right: -14px; bottom: -18px;
      font-size: 7.5rem;
      color: var(--jc-accent, #3b82f6);
      opacity: .08;
      pointer-events: none;
    }
    .juego-label {
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--jc-text, #93c5fd);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .biper-grande { font-size: 3.6rem; font-weight: 900; line-height: 1; color: rgba(255,255,255,.96); }
    .familia-nombre { font-size: 1.3rem; font-weight: 700; margin: 4px 0 12px; color: rgba(255,255,255,.85); }

    .estado-pill {
      display: inline-flex; align-items:center; gap:8px;
      font-size: .82rem; font-weight: 800; letter-spacing:.5px;
      padding: 5px 14px; border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .estado-pill .dot { width:8px; height:8px; border-radius:50%; }
    .estado-pill.jugando { background: rgba(34,197,94,.16); color:#4ade80; }
    .estado-pill.jugando .dot { background:#4ade80; }
    .estado-pill.llamado { background: rgba(245,158,11,.16); color:#fbbf24; }
    .estado-pill.llamado .dot { background:#fbbf24; }

    .tag-miembros { font-size:.92rem; color:rgba(255,255,255,0.65); font-weight:600; display:flex; align-items:center; gap:7px; margin-bottom: 14px; }

    .etapa-tv { display:flex; align-items:center; gap:8px; margin-bottom: 12px; flex-wrap:wrap; }
    .etapa-tv-actual { font-size:.85rem; font-weight:700; background:rgba(255,255,255,.08); color:#e2e8f0; padding:4px 12px; border-radius:20px; }
    .etapa-tv-sig    { font-size:.8rem; color:rgba(255,255,255,.4); }

    .restante-label { font-size:.8rem; color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; margin-bottom:4px; }
    .restante-num { font-size: 2.1rem; font-weight: 900; color: var(--jc-accent, #60a5fa); line-height:1; margin-bottom: 12px; }
    .restante-num .u { font-size:1.1rem; font-weight:700; margin-left:4px; color: rgba(255,255,255,.5); }
    .restante-num.vencido { color: #f87171; }

    /* Barra de progreso segmentada (bloques) */
    .segmentos { display:flex; gap:4px; }
    .segmento { flex:1; height:9px; border-radius:3px; background: rgba(255,255,255,0.08); }
    .segmento.lleno { background: var(--jc-accent, #3b82f6); }
    .segmento.vencido-seg { background: #f87171; }

    /* ── Columna cola de espera ── */
    .lista-cola { display:flex; flex-direction:column; gap:12px; }
    .card-cola {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 5px solid #22c55e;
      border-radius: 14px;
      padding: 16px 20px;
    }
    .card-cola.proximo {
      background: rgba(34,197,94,0.1);
      border-color: rgba(34,197,94,0.35);
    }
    .cola-posicion {
      font-size: 1.7rem; font-weight: 900; color: #4ade80;
      background: rgba(34,197,94,.12);
      border-radius: 12px;
      min-width: 58px; height: 58px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink: 0;
    }
    .cola-datos { flex: 1; min-width:0; }
    .cola-nombre { font-size: 1.25rem; font-weight: 800; color: rgba(255,255,255,.94); }
    .cola-juego { font-size: .9rem; font-weight: 700; margin-top: 4px; display:flex; align-items:center; gap:7px; }
    .cola-espera { text-align:right; flex-shrink:0; }
    .cola-espera .aprox { font-size: .75rem; color: rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; }
    .cola-espera .num { font-size: 1.8rem; font-weight: 900; color: #4ade80; line-height:1.3; }
    .card-cola.proximo .cola-espera .num { color:#4ade80; }

    /* Sin datos */
    .sin-datos {
      text-align: center;
      color: rgba(255,255,255,0.25);
      padding: 60px 20px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .sin-datos i { font-size: 4rem; display:block; margin-bottom:16px; opacity:.6; }

    /* ── Footer informativo ── */
    footer {
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      padding: 18px 36px;
      display: flex;
      justify-content: space-around;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer-item { display:flex; align-items:center; gap:14px; }
    .footer-item .icono {
      width: 44px; height: 44px; border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .footer-item:nth-child(1) .icono { background: rgba(59,130,246,.15); color:#60a5fa; }
    .footer-item:nth-child(2) .icono { background: rgba(250,204,21,.15); color:#facc15; }
    .footer-item:nth-child(3) .icono { background: rgba(249,115,22,.15); color:#fb923c; }
    .footer-item .texto .linea1 { font-size:.82rem; font-weight:700; letter-spacing:.5px; color: rgba(255,255,255,.6); text-transform:uppercase; }
    .footer-item .texto .linea2 { font-size:1rem; font-weight:800; color: rgba(255,255,255,.95); }
    .footer-item:nth-child(1) .texto .linea2 { color:#93c5fd; }
    .footer-item:nth-child(3) .texto .linea2 { color:#fdba74; }

    /* Flash */
    #flash {
      pointer-events:none; position:fixed; inset:0;
      background:rgba(59,130,246,0.15); opacity:0;
      transition:opacity .2s; z-index:999;
    }
    #flash.show { opacity:1; }

    /* Animación de nuevo elemento */
    @keyframes slideIn { from { opacity:0; transform:translateY(-8px);} to { opacity:1; transform:translateY(0);} }
    .nuevo { animation: slideIn .35s ease; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }
  </style>
</head>
<body>
<div id="flash"></div>

<header>
  <div class="marca">
    <div class="marca-icono"><i class="bi bi-controller"></i></div>
    <div class="marca-nombre">UNIVERSALL<br>ENTRETENIMIENTOS</div>
  </div>
  <div class="titulo-central">
    <h1>COLA DE TURNOS</h1>
    <div class="subtitulo">Esperando para ingresar</div>
  </div>
  <div class="reloj-wrap">
    <i class="bi bi-clock"></i>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<div class="filtros" id="filtros">
  <span class="etiqueta">Filtrar:</span>
  <button class="filtro-btn activo" data-id=""><i class="bi bi-grid-3x3-gap-fill"></i>Todos</button>
</div>

<main>
  <div class="col-jugando">
    <div class="col-title">
      <span class="dot dot-azul"></span>
      Jugando ahora
    </div>
    <div class="grid-jugando" id="listaJugando">
      <div class="sin-datos"><i class="bi bi-controller"></i>Sin grupos jugando</div>
    </div>
  </div>

  <div class="col-cola">
    <div class="col-title">
      <span class="dot dot-verde"></span>
      Próximos en espera
    </div>
    <div class="lista-cola" id="listaCola">
      <div class="sin-datos"><i class="bi bi-hourglass-split"></i>Sin grupos en espera</div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-item">
    <div class="icono"><i class="bi bi-info-circle-fill"></i></div>
    <div class="texto">
      <div class="linea1">Los tiempos son</div>
      <div class="linea2">Estimados</div>
    </div>
  </div>
  <div class="footer-item">
    <div class="icono"><i class="bi bi-star-fill"></i></div>
    <div class="texto">
      <div class="linea1">¡Gracias por elegirnos!</div>
      <div class="linea2">Que te diviertas</div>
    </div>
  </div>
  <div class="footer-item">
    <div class="icono"><i class="bi bi-ticket-perforated-fill"></i></div>
    <div class="texto">
      <div class="linea1">¿Ya tenés tu turno?</div>
      <div class="linea2">Preparate y que comience la diversión</div>
    </div>
  </div>
</footer>

<link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="/js/cola.js"></script>
</body>
</html>
