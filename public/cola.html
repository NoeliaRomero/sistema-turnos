<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cola de Turnos – Pantalla Pública</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    /* Base pensada para un TV de 55" visto a varios metros de distancia. */
    html { font-size: 20px; }

    body {
      background: radial-gradient(circle at 50% 50%, #0a1428 0%, #000507 100%);
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Fondo decorativo animado (Speed Park bg-fx) ──────────────────────── */
    .bg-fx { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    header, .filtros, main { position: relative; z-index: 1; }

    .energy-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .4; animation: pulse-glow 4s ease-in-out infinite; }
    .energy-left-1  { width:600px; height:600px; left:-200px; top:100px; background: radial-gradient(circle, rgba(255,45,0,.8) 0%, rgba(255,107,53,.3) 100%); animation-delay: 0s; }
    .energy-left-2  { width:800px; height:800px; left:0; bottom:-200px; background: radial-gradient(circle, rgba(255,45,0,.6) 0%, rgba(255,107,53,.2) 100%); animation-delay: 1s; }
    .energy-right-1 { width:700px; height:700px; right:-150px; top:50px; background: radial-gradient(circle, rgba(109,40,217,.9) 0%, rgba(168,85,247,.3) 100%); animation-delay: .5s; }
    .energy-right-2 { width:600px; height:600px; right:-100px; bottom:0; background: radial-gradient(circle, rgba(168,85,247,.7) 0%, rgba(109,40,217,.2) 100%); animation-delay: 1.5s; }
    @keyframes pulse-glow { 0%,100% { opacity:.3; transform:scale(1); } 50% { opacity:.6; transform:scale(1.05); } }

    .spark-line { position: absolute; opacity: 0; }
    .spark-line::before { content:''; position:absolute; background: linear-gradient(90deg, transparent, #ff6b35, transparent); animation: spark-flash 2s ease-in-out infinite; width:100%; height:100%; }
    .spark-left-1  { width:200px; height:3px; left:30px; top:150px; transform:rotate(-35deg); }
    .spark-left-1::before  { animation-delay: 0s; }
    .spark-left-2  { width:250px; height:3px; left:60px; top:450px; transform:rotate(20deg); }
    .spark-left-2::before  { animation-delay: .6s; }
    .spark-left-3  { width:220px; height:3px; left:40px; bottom:200px; transform:rotate(-25deg); }
    .spark-left-3::before  { animation-delay: 1.2s; }
    .spark-right-1 { width:200px; height:3px; right:50px; top:180px; transform:rotate(40deg); }
    .spark-right-1::before { background: linear-gradient(90deg, transparent, #a855f7, transparent); animation-delay: .3s; }
    .spark-right-2 { width:240px; height:3px; right:80px; top:500px; transform:rotate(-30deg); }
    .spark-right-2::before { background: linear-gradient(90deg, transparent, #6d28d9, transparent); animation-delay: .9s; }
    .spark-right-3 { width:210px; height:3px; right:60px; bottom:220px; transform:rotate(35deg); }
    .spark-right-3::before { background: linear-gradient(90deg, transparent, #a855f7, transparent); animation-delay: 1.5s; }
    @keyframes spark-flash { 0%,100% { opacity:0; } 50% { opacity:1; } }

    .particle { position:absolute; border-radius:50%; filter:blur(2px); box-shadow:0 0 10px currentColor; animation: float-up 6s ease-out infinite; }
    .particle-red     { color:#ff2d00; width:8px; height:8px; left:100px; bottom:-10px; animation-duration:5s; }
    .particle-orange  { color:#ff6b35; width:6px; height:6px; left:150px; bottom:-10px; animation-duration:6s; animation-delay:1s; }
    .particle-purple-1{ color:#a855f7; width:8px; height:8px; right:120px; bottom:-10px; animation-duration:5.5s; animation-delay:.5s; }
    .particle-purple-2{ color:#6d28d9; width:6px; height:6px; right:200px; bottom:-10px; animation-duration:6s; animation-delay:1.5s; }
    @keyframes float-up { 0% { opacity:0; transform:translateY(0) translateX(0); } 50% { opacity:1; } 100% { opacity:0; transform:translateY(-400px) translateX(50px); } }

    /* Rayos de energía que se expanden */
    .energy-ray { position: absolute; opacity: 0; }
    .energy-ray::before { content:''; position:absolute; background: linear-gradient(135deg, transparent 0%, currentColor 50%, transparent 100%); animation: ray-burst 3s ease-out infinite; }
    .ray-left-1  { width:300px; height:150px; left:50px; top:20%; color:#ff2d00; }
    .ray-left-1::before  { width:100%; height:100%; clip-path: polygon(0 50%, 100% 0, 100% 100%); animation-delay: 0s; }
    .ray-left-2  { width:350px; height:180px; left:30px; bottom:15%; color:#ff6b35; }
    .ray-left-2::before  { width:100%; height:100%; clip-path: polygon(0 50%, 100% 0, 100% 100%); animation-delay: 1.5s; }
    .ray-right-1 { width:300px; height:150px; right:50px; top:15%; color:#a855f7; transform: scaleX(-1); }
    .ray-right-1::before { width:100%; height:100%; clip-path: polygon(100% 50%, 0 0, 0 100%); animation-delay: .5s; }
    .ray-right-2 { width:350px; height:180px; right:30px; bottom:10%; color:#6d28d9; transform: scaleX(-1); }
    .ray-right-2::before { width:100%; height:100%; clip-path: polygon(100% 50%, 0 0, 0 100%); animation-delay: 2s; }
    @keyframes ray-burst { 0% { opacity:0; transform:scale(.5); } 30% { opacity:.7; } 100% { opacity:0; transform:scale(1.2); } }

    /* Destellos explosivos */
    .energy-flash { position:absolute; border-radius:50%; opacity:0; animation: flash-burst 2s ease-out infinite; }
    .flash-left-1  { width:150px; height:150px; left:80px; top:30%; background: radial-gradient(circle, rgba(255,107,53,.8) 0%, transparent 70%); box-shadow:0 0 30px rgba(255,45,0,.6); animation-delay:0s; }
    .flash-left-2  { width:120px; height:120px; left:150px; bottom:25%; background: radial-gradient(circle, rgba(255,45,0,.7) 0%, transparent 70%); box-shadow:0 0 25px rgba(255,107,53,.5); animation-delay:1.2s; }
    .flash-right-1 { width:150px; height:150px; right:100px; top:25%; background: radial-gradient(circle, rgba(168,85,247,.8) 0%, transparent 70%); box-shadow:0 0 30px rgba(109,40,217,.6); animation-delay:.6s; }
    .flash-right-2 { width:120px; height:120px; right:150px; bottom:20%; background: radial-gradient(circle, rgba(109,40,217,.7) 0%, transparent 70%); box-shadow:0 0 25px rgba(168,85,247,.5); animation-delay:1.8s; }
    @keyframes flash-burst { 0% { opacity:0; transform:scale(0); } 40% { opacity:.8; } 100% { opacity:0; transform:scale(1.5); } }

    /* Líneas diagonales de energía */
    .diagonal-line { position:absolute; opacity:0; animation: diagonal-pulse 3s ease-in-out infinite; }
    .diagonal-line::before { content:''; position:absolute; background: linear-gradient(45deg, transparent, currentColor, transparent); animation: pulse-length 2.5s ease-in-out infinite; }
    .diag-left-1  { width:250px; height:8px; left:40px; top:35%; color:#ff2d00; transform:rotate(-45deg); }
    .diag-left-1::before  { width:100%; height:100%; animation-delay:0s; }
    .diag-left-2  { width:280px; height:8px; left:80px; bottom:30%; color:#ff6b35; transform:rotate(25deg); }
    .diag-left-2::before  { width:100%; height:100%; animation-delay:1s; }
    .diag-right-1 { width:250px; height:8px; right:50px; top:40%; color:#a855f7; transform:rotate(45deg); }
    .diag-right-1::before { width:100%; height:100%; animation-delay:.5s; }
    .diag-right-2 { width:280px; height:8px; right:90px; bottom:25%; color:#6d28d9; transform:rotate(-25deg); }
    .diag-right-2::before { width:100%; height:100%; animation-delay:1.5s; }
    @keyframes diagonal-pulse { 0%,100% { opacity:0; } 50% { opacity:.6; } }
    @keyframes pulse-length { 0%,100% { transform:scaleX(0); } 50% { transform:scaleX(1); } }

    .grid-overlay {
      position:absolute; width:100%; height:100%; opacity:.03;
      background-image:
        linear-gradient(0deg, transparent 24%, rgba(30,58,138,.5) 25%, rgba(30,58,138,.5) 26%, transparent 27%, transparent 74%, rgba(30,58,138,.5) 75%, rgba(30,58,138,.5) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(30,58,138,.5) 25%, rgba(30,58,138,.5) 26%, transparent 27%, transparent 74%, rgba(30,58,138,.5) 75%, rgba(30,58,138,.5) 76%, transparent 77%, transparent);
      background-size: 100px 100px;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      padding: 20px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .marca { display:flex; align-items:center; gap:14px; }
    .marca-icono {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .marca-nombre { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; color: rgba(255,255,255,.92); line-height:1.15; }

    .titulo-central { text-align: center; flex: 1; }
    .titulo-central h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }
    .titulo-central .subtitulo {
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #60a5fa;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .reloj-wrap { display:flex; align-items:center; gap:12px; }
    .reloj-wrap i { font-size: 1.6rem; color: rgba(255,255,255,.4); }
    .clock { font-size: 1.9rem; font-weight: 700; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }

    /* ── Filtro juegos ── */
    .filtros {
      padding: 8px 36px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .filtros .etiqueta { color:rgba(255,255,255,.4); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; }
    .filtro-btn {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .filtro-btn i { font-size: .9rem; }
    .filtro-btn.activo {
      background: var(--jc-accent, #3b82f6);
      border-color: var(--jc-accent, #3b82f6);
      color: white;
      box-shadow: 0 4px 16px -4px var(--jc-accent, #3b82f6);
    }

    /* ── Contenido principal ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .col-jugando, .col-cola { overflow-y: auto; padding: 18px 32px 26px; }
    .col-jugando { border-right: 1px solid rgba(255,255,255,0.08); }

    .col-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .col-title .dot {
      width: 13px; height: 13px;
      border-radius: 50%;
      animation: blink-dot 1.2s ease infinite;
    }
    .dot-azul  { background: #3b82f6; box-shadow: 0 0 12px #3b82f6; }
    .dot-verde { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
    @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* Grilla de tarjetas "jugando ahora" */
    /* Una sola columna siempre: dejamos de calcular cuántas entran según el
       ancho disponible (minmax/auto-fill), porque eso depende del ancho real
       que reporte cada TV — y varía. Con 1 columna fija, el paginado (ver
       POR_PAGINA_JUGANDO=1 en cola.js) es 100% predecible en cualquier
       pantalla: siempre una card completa por vez, rotando. */
    .grid-jugando {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      max-width: 460px;
    }

    /* Tarjeta jugando — coloreada según --jc-* seteadas inline por juego.
       La foto del juego (--jc-img) cubre la card entera con "cover", pero el
       degradado oscuro tapa un poco más que antes (48%/74% en vez de 40%/68%)
       para que se vea un toque más chica sin perder el recorte que esconde el
       logo/texto que la propia imagen trae dibujado arriba. */
    .card-jugando {
      position: relative;
      overflow: hidden;
      /* max-width: cuando queda una sola card en el grid (ej. al filtrar por
         un juego), la grilla la estira a lo ancho del contenedor entero —
         esto la tapa para que mantenga un tamaño razonable siempre. */
      max-width: 460px;
      background:
        linear-gradient(100deg, rgba(6,10,28,.95) 0%, rgba(6,10,28,.9) 48%, rgba(6,10,28,.5) 74%, rgba(6,10,28,.2) 100%),
        var(--jc-img, none) center right / cover no-repeat,
        var(--jc-bg, rgba(59,130,246,0.1));
      border: 1.5px solid var(--jc-border, rgba(59,130,246,0.3));
      border-radius: 18px;
      padding: 20px 22px;
      /* Columna con el bloque de tiempo anclado abajo (.restante-wrap con
         margin-top:auto) — así todas las cards alinean el tiempo restante al
         mismo borde inferior, tengan o no etapas/otro contenido variable. */
      display: flex;
      flex-direction: column;
    }
    .restante-wrap { margin-top: auto; }
    .card-jugando .icono-fondo {
      position: absolute;
      right: -14px; bottom: -18px;
      font-size: 7.5rem;
      color: var(--jc-accent, #3b82f6);
      opacity: .08;
      pointer-events: none;
    }
    .juego-label {
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--jc-text, #93c5fd);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .biper-grande { font-size: 3.6rem; font-weight: 900; line-height: 1; color: rgba(255,255,255,.96); }
    .familia-nombre { font-size: 1.3rem; font-weight: 700; margin: 4px 0 12px; color: rgba(255,255,255,.85); }

    .estado-pill {
      align-self: flex-start;
      display: inline-flex; align-items:center; gap:8px;
      font-size: .82rem; font-weight: 800; letter-spacing:.5px;
      padding: 5px 14px; border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .estado-pill .dot { width:8px; height:8px; border-radius:50%; }
    .estado-pill.jugando { background: rgba(34,197,94,.16); color:#4ade80; }
    .estado-pill.jugando .dot { background:#4ade80; }
    .estado-pill.llamado { background: rgba(245,158,11,.16); color:#fbbf24; }
    .estado-pill.llamado .dot { background:#fbbf24; }

    .tag-miembros { font-size:.92rem; color:rgba(255,255,255,0.65); font-weight:600; display:flex; align-items:center; gap:7px; margin-bottom: 14px; }

    .etapa-tv { display:flex; align-items:center; gap:8px; margin-bottom: 12px; flex-wrap:wrap; }
    .etapa-tv-actual { font-size:.85rem; font-weight:700; background:rgba(255,255,255,.08); color:#e2e8f0; padding:4px 12px; border-radius:20px; }
    .etapa-tv-sig    { font-size:.8rem; color:rgba(255,255,255,.4); }

    .restante-label { font-size:.8rem; color:rgba(255,255,255,.45); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; margin-bottom:4px; }
    .restante-num { font-size: 2.1rem; font-weight: 900; color: var(--jc-accent, #60a5fa); line-height:1; margin-bottom: 12px; }
    .restante-num .u { font-size:1.1rem; font-weight:700; margin-left:4px; color: rgba(255,255,255,.5); }
    .restante-num.vencido { color: #f87171; }

    /* Barra de progreso segmentada (bloques) */
    .segmentos { display:flex; gap:4px; }
    .segmento { flex:1; height:9px; border-radius:3px; background: rgba(255,255,255,0.08); }
    .segmento.lleno { background: var(--jc-accent, #3b82f6); }
    .segmento.vencido-seg { background: #f87171; }

    /* ── Columna cola de espera ── */
    .lista-cola { display:flex; flex-direction:column; gap:12px; }
    .card-cola {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 5px solid #22c55e;
      border-radius: 14px;
      padding: 16px 20px;
    }
    .card-cola.proximo {
      background: rgba(34,197,94,0.1);
      border-color: rgba(34,197,94,0.35);
    }
    .cola-posicion {
      font-size: 1.7rem; font-weight: 900; color: #4ade80;
      background: rgba(34,197,94,.12);
      border-radius: 12px;
      min-width: 58px; height: 58px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink: 0;
    }
    .cola-datos { flex: 1; min-width:0; }
    .cola-nombre { font-size: 1.25rem; font-weight: 800; color: rgba(255,255,255,.94); }
    .cola-juego { font-size: .9rem; font-weight: 700; margin-top: 4px; display:flex; align-items:center; gap:7px; }
    .cola-espera { text-align:right; flex-shrink:0; }
    .cola-espera .aprox { font-size: .75rem; color: rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:1.5px; font-weight:700; }
    .cola-espera .num { font-size: 1.8rem; font-weight: 900; color: #4ade80; line-height:1.3; }
    .card-cola.proximo .cola-espera .num { color:#4ade80; }

    /* Sin datos */
    .sin-datos {
      text-align: center;
      color: rgba(255,255,255,0.25);
      padding: 60px 20px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .sin-datos i { font-size: 4rem; display:block; margin-bottom:16px; opacity:.6; }

    /* Puntitos del paginado automático — solo aparecen cuando hay más de una
       página (ver ROTACION_MS en cola.js). Vacío = no se ve nada. */
    .paginador { display:flex; justify-content:center; gap:9px; margin-top:16px; }
    .dot-pag { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.15); transition: all .3s; }
    .dot-pag.activo { background:rgba(255,255,255,.85); transform: scale(1.3); }


    /* Flash */
    #flash {
      pointer-events:none; position:fixed; inset:0;
      background:rgba(59,130,246,0.15); opacity:0;
      transition:opacity .2s; z-index:999;
    }
    #flash.show { opacity:1; }

    /* Animación de nuevo elemento */
    @keyframes slideIn { from { opacity:0; transform:translateY(-8px);} to { opacity:1; transform:translateY(0);} }
    .nuevo { animation: slideIn .35s ease; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }
  </style>
</head>
<body>
<div class="bg-fx">
  <div class="energy-orb energy-left-1"></div>
  <div class="energy-orb energy-left-2"></div>
  <div class="energy-orb energy-right-1"></div>
  <div class="energy-orb energy-right-2"></div>
  <div class="spark-line spark-left-1"></div>
  <div class="spark-line spark-left-2"></div>
  <div class="spark-line spark-left-3"></div>
  <div class="spark-line spark-right-1"></div>
  <div class="spark-line spark-right-2"></div>
  <div class="spark-line spark-right-3"></div>
  <div class="particle particle-red"></div>
  <div class="particle particle-orange"></div>
  <div class="particle particle-purple-1"></div>
  <div class="particle particle-purple-2"></div>
  <div class="energy-ray ray-left-1"></div>
  <div class="energy-ray ray-left-2"></div>
  <div class="energy-ray ray-right-1"></div>
  <div class="energy-ray ray-right-2"></div>
  <div class="energy-flash flash-left-1"></div>
  <div class="energy-flash flash-left-2"></div>
  <div class="energy-flash flash-right-1"></div>
  <div class="energy-flash flash-right-2"></div>
  <div class="diagonal-line diag-left-1"></div>
  <div class="diagonal-line diag-left-2"></div>
  <div class="diagonal-line diag-right-1"></div>
  <div class="diagonal-line diag-right-2"></div>
  <div class="grid-overlay"></div>
</div>
<div id="flash"></div>

<header>
  <div class="marca">
    <div class="marca-icono"><i class="bi bi-controller"></i></div>
    <div class="marca-nombre">UNIVERSALL<br>ENTRETENIMIENTOS</div>
  </div>
  <div class="titulo-central">
    <h1>COLA DE TURNOS</h1>
    <div class="subtitulo">Esperando para ingresar</div>
  </div>
  <div class="reloj-wrap">
    <i class="bi bi-clock"></i>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<div class="filtros" id="filtros">
  <span class="etiqueta">Filtrar:</span>
  <button class="filtro-btn activo" data-id=""><i class="bi bi-grid-3x3-gap-fill"></i>Todos</button>
</div>

<main>
  <div class="col-jugando">
    <div class="col-title">
      <span class="dot dot-azul"></span>
      Jugando ahora
    </div>
    <div class="grid-jugando" id="listaJugando">
      <div class="sin-datos"><i class="bi bi-controller"></i>Sin grupos jugando</div>
    </div>
    <div class="paginador" id="dotsJugando"></div>
  </div>

  <div class="col-cola">
    <div class="col-title">
      <span class="dot dot-verde"></span>
      Próximos en espera
    </div>
