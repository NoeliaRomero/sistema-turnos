<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar – Sistema de Turnos</title>
  <link href="/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #05091f 0%, #0d1b4b 60%, #1a3a8f 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      width: 100%; max-width: 420px;
      border: none; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo-wrap {
      width: 96px; height: 96px; border-radius: 50%;
      margin: 0 auto 20px;
    }
    .logo-wrap img { width: 100%; height: 100%; display: block; }
    .btn-login {
      background: linear-gradient(135deg,#1e40af,#3b82f6);
      border: none; color: white; font-weight: 700;
      padding: 12px; font-size: 1.05rem;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .9; color: white; }
    #errorMsg { display: none; }
  </style>
</head>
<body>
  <div class="card login-card p-5">
    <div class="text-center mb-4">
      <div class="logo-wrap"><img src="/assets/logo.png" alt="Sistema Universal"></div>
      <h3 class="fw-bold mb-1">Sistema de Turnos</h3>
      <p class="text-muted mb-0">Ingresá con tu usuario y contraseña</p>
    </div>

    <div class="alert alert-danger rounded-3" id="errorMsg" role="alert"></div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label fw-semibold" for="inputUser">Usuario</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="inputUser" placeholder="Ej: admin" autocomplete="username" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold" for="inputPass">Contraseña</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="inputPass" placeholder="••••••••" autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button" id="btnTogglePass">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-login w-100 rounded-3" id="btnLogin">
        <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Ingresar</span>
        <span id="btnSpinner" class="d-none">
          <span class="spinner-border spinner-border-sm me-2"></span>Ingresando…
        </span>
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="/pantalla.html" target="_blank" class="text-muted text-decoration-none small">
        <i class="bi bi-display me-1"></i>Ver pantalla pública
      </a>
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('btnTogglePass').addEventListener('click', () => {
      const inp  = document.getElementById('inputPass');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else                         { inp.type = 'password'; icon.className = 'bi bi-eye'; }
    });

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl    = document.getElementById('errorMsg');
      const btnText  = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      errEl.style.display = 'none';
      btnText.classList.add('d-none');
      btnSpinner.classList.remove('d-none');

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('inputUser').value.trim(),
            password: document.getElementById('inputPass').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.redirect;
        } else {
          errEl.textContent    = data.error || 'Error al ingresar';
          errEl.style.display  = 'block';
        }
      } catch (_) {
        errEl.textContent   = 'Error de conexión con el servidor';
        errEl.style.display = 'block';
      } finally {
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
