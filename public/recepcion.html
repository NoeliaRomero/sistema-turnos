<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepción – Sistema de Turnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .navbar-custom { background: #7c2d12; }
    .card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .biper-num {
      display: inline-block; background: #7c2d12; color: white;
      font-size: 1.5rem; font-weight: 900; min-width: 52px;
      text-align: center; padding: 6px 14px; border-radius: 10px;
    }
    .miembros-badge {
      background: #fef3c7; color: #92400e;
      font-size: .8rem; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
    }
    .espera-badge {
      font-size: .8rem; font-weight: 700;
      padding: 4px 12px; border-radius: 20px;
    }
    .espera-0    { background: #d1fae5; color: #065f46; }
    .espera-baja { background: #fef3c7; color: #92400e; }
    .espera-alta { background: #fee2e2; color: #991b1b; }

    .turno-row { border-left: 5px solid #fbbf24; background: white; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
    .turno-row.jugando { border-left-color: #3b82f6; background: #eff6ff; }

    /* ── Tabs de juegos ── */
    .nav-tabs .nav-link { font-weight: 600; color: #6c757d; border-radius: 8px 8px 0 0; }
    .nav-tabs .nav-link.active { color: #7c2d12; border-bottom-color: white; }
    .nav-tabs .nav-link:hover:not(.active) { background: rgba(0,0,0,0.04); }

    /* ── Título de sección dentro del panel ── */
    .seccion-titulo {
      font-size: .72rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #9ca3af; padding: 4px 0 8px;
      border-bottom: 1px solid #e5e7eb; margin-bottom: 10px;
    }

    /* ── Número de posición en cola ── */
    .pos-num {
      width: 28px; height: 28px; border-radius: 50%;
      background: #e5e7eb; color: #6b7280;
      font-weight: 800; font-size: .9rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .opacity-65 { opacity: .65; }

    /* ── Toast de notificación de operador ── */
    .notif-operador { background: #1e293b; color: white; min-width: 320px; border-radius: 12px; }
    .notif-header   { background: #0f172a; color: white; border-radius: 12px 12px 0 0; padding: 10px 14px; }
    .notif-op       { background: rgba(255,255,255,.15); border-radius: 20px; padding: 1px 8px; font-size: .8rem; margin-right: 4px; }
    .notif-siguiente {
      margin-top: 8px; padding: 7px 10px;
      background: rgba(255,255,255,.08); border-radius: 8px;
      font-size: .85rem; color: rgba(255,255,255,.85);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3">
  <span class="navbar-brand fw-bold fs-5">
    <i class="bi bi-door-open me-2"></i>Recepción
  </span>
  <div class="d-flex align-items-center gap-2">
    <span class="text-white-50 small" id="usuarioNombre"></span>
    <a href="/cola.html" class="btn btn-outline-light btn-sm" target="_blank">
      <i class="bi bi-display me-1"></i>Pantalla Cola
    </a>
    <a href="/juegos.html" class="btn btn-outline-light btn-sm" id="btnJuegos" style="display:none">
      <i class="bi bi-controller me-1"></i>Juegos
    </a>
    <button class="btn btn-outline-light btn-sm" id="btnLogout">
      <i class="bi bi-box-arrow-right me-1"></i>Salir
    </button>
  </div>
</nav>

<div class="container-fluid px-4 mt-4">
  <div class="row g-4">

    <!-- Formulario registro -->
    <div class="col-xl-4 col-lg-5">
      <div class="card p-4">
        <h5 class="fw-bold mb-4">
          <i class="bi bi-person-plus-fill me-2 text-danger"></i>Registrar Grupo
        </h5>
        <form id="formRegistro" novalidate>

          <div class="mb-3">
            <label class="form-label fw-semibold">Juego <span class="text-danger">*</span></label>
            <select class="form-select form-select-lg" id="selectJuego" required>
              <option value="">Seleccionar juego…</option>
            </select>
            <div class="form-text" id="duracionJuego"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Número de Biper <span class="text-danger">*</span></label>
            <div class="input-group input-group-lg">
              <input type="number" id="inputBiper" class="form-control" min="1" max="999" placeholder="Ej: 5" required>
              <button type="button" class="btn btn-outline-secondary" id="btnAutoBiper" title="Asignar automáticamente">
                <i class="bi bi-magic"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Dispositivo VIPER</label>
            <select class="form-select" id="selectViper">
              <option value="">Sin VIPER físico</option>
            </select>
            <div class="form-text">Solo se listan los VIPERs validados y activos</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Familia / Nombre del grupo <span class="text-danger">*</span></label>
            <input type="text" id="inputNombre" class="form-control form-control-lg"
              placeholder="Ej: Familia García" maxlength="60" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Cantidad de miembros <span class="text-danger">*</span></label>
            <div class="input-group input-group-lg">
              <button type="button" class="btn btn-outline-secondary" id="btnMenos">
                <i class="bi bi-dash-lg"></i>
              </button>
              <input type="number" id="inputMiembros" class="form-control text-center fw-bold"
                min="1" max="30" value="1" required>
              <button type="button" class="btn btn-outline-secondary" id="btnMas">
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
            <div class="form-text">Número de personas del grupo</div>
          </div>

          <!-- Tiempo de espera estimado para el juego seleccionado -->
          <div id="tiempoEsperaWrap" class="alert alert-info d-none mb-3">
            <i class="bi bi-clock me-2"></i>
            <span id="tiempoEsperaMsg">Cargando…</span>
          </div>

          <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold">
            <i class="bi bi-check-circle me-2"></i>Registrar en Cola
          </button>
        </form>
      </div>
    </div>

    <!-- Cola por juego -->
    <div class="col-xl-8 col-lg-7">
      <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0">
            <i class="bi bi-list-ol me-2 text-danger"></i>Estado Actual
          </h5>
          <button class="btn btn-outline-secondary btn-sm" id="btnRefresh">
            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
          </button>
        </div>
        <div id="colaPorJuego">
          <p class="text-center text-muted py-4">
            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>Sin grupos registrados
          </p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal confirmación: finalizar turno -->
<div class="modal fade" id="modalConfFinalizar" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 text-center p-4">
      <div class="fs-1 mb-2">✅</div>
      <h6 class="fw-bold mb-2">¿Finalizar turno?</h6>
      <p class="text-muted small mb-3">
        El turno de <strong id="confFinalizarNombre"></strong> quedará registrado como finalizado.
      </p>
      <div class="d-flex gap-2">
        <button class="btn btn-secondary flex-fill" id="btnConfFinalizarNo">
          <i class="bi bi-x-circle me-1"></i>Cancelar
        </button>
        <button class="btn btn-danger flex-fill fw-bold" id="btnConfFinalizarSi">
          <i class="bi bi-check-lg me-1"></i>Sí, finalizar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal confirmación: llamar con juego ocupado -->
<div class="modal fade" id="modalConfLlamar" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 text-center p-4">
      <div class="fs-1 mb-2">⚠️</div>
      <h6 class="fw-bold mb-2">Juego ocupado</h6>
      <p class="text-muted small mb-3" id="confLlamarTexto"></p>
      <div class="d-flex gap-2">
        <button class="btn btn-secondary flex-fill" id="btnConfLlamarNo">
          <i class="bi bi-x-circle me-1"></i>Cancelar
        </button>
        <button class="btn btn-success flex-fill fw-bold" id="btnConfLlamarSi">
          <i class="bi bi-megaphone me-1"></i>Sí, llamar
        </button>
      </div>
    </div>
  </div>
</div>


<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/recepcion.js"></script>
</body>
</html>
