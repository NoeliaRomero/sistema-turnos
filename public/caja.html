<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja – Sistema de Turnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .navbar-custom { background: #0d1b4b; }
    .card { border: none; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .biper-num {
      display: inline-block; background: #0d1b4b; color: white;
      font-size: 1.3rem; font-weight: 800; min-width: 48px;
      text-align: center; padding: 4px 12px; border-radius: 8px;
    }
    .turno-row { border-left: 4px solid #dee2e6; transition: border-color .2s; }
    .turno-row.esperando { border-left-color: #ffc107; }
    .turno-row.llamado   { border-left-color: #0d6efd; }
    .estado-badge { font-size: .75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .estado-esperando { background: #fff3cd; color: #856404; }
    .estado-llamado   { background: #cfe2ff; color: #0a58ca; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom px-4 py-3">
  <span class="navbar-brand fw-bold fs-5">
    <i class="bi bi-cash-register me-2"></i>Caja
  </span>
  <div class="d-flex align-items-center gap-2">
    <span class="text-white-50 small" id="usuarioNombre"></span>
    <!-- Visible solo si tiene permiso_gestionar_juegos (se activa desde JS) -->
    <a href="/juegos.html" class="btn btn-outline-light btn-sm" id="btnJuegos" style="display:none">
      <i class="bi bi-controller me-1"></i>Juegos
    </a>
    <button class="btn btn-outline-light btn-sm" id="btnLogout">
      <i class="bi bi-box-arrow-right me-1"></i>Salir
    </button>
  </div>
</nav>

<div class="container-fluid px-4 mt-4">
  <div class="row g-4">

    <div class="col-xl-4 col-lg-5">
      <div class="card p-4">
        <h5 class="fw-bold mb-4"><i class="bi bi-plus-circle-fill me-2 text-primary"></i>Nueva Venta</h5>
        <form id="formVenta" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Atracción <span class="text-danger">*</span></label>
            <select class="form-select form-select-lg" id="selectAtraccion" required>
              <option value="">Seleccionar…</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Número de Biper <span class="text-danger">*</span></label>
            <div class="input-group input-group-lg">
              <input type="number" id="inputBiper" class="form-control" min="1" max="999" placeholder="Ej: 5" required>
              <button type="button" class="btn btn-outline-secondary" id="btnAutoBiper" title="Asignar automáticamente">
                <i class="bi bi-magic"></i>
              </button>
            </div>
            <div class="form-text">Clic en <i class="bi bi-magic"></i> para asignar automáticamente</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Nombre / Familia <span class="text-muted fw-normal">(opcional)</span></label>
            <input type="text" id="inputNombre" class="form-control form-control-lg" placeholder="Ej: Familia García" maxlength="60">
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
            <i class="bi bi-check-circle me-2"></i>Registrar Turno
          </button>
        </form>
      </div>
    </div>

    <div class="col-xl-8 col-lg-7">
      <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold mb-0"><i class="bi bi-list-ul me-2 text-primary"></i>Turnos Activos</h5>
          <span class="badge bg-primary rounded-pill fs-6 px-3" id="contadorTurnos">0</span>
        </div>
        <div id="listaTurnos">
          <p class="text-center text-muted py-5">
            <i class="bi bi-inbox fs-1 d-block mb-2 opacity-50"></i>Sin turnos registrados
          </p>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/caja.js"></script>
<script src="/js/demo-panel.js"></script>
</body>
</html>
