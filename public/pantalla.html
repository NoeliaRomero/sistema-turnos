<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla Operativa – Sistema de Turnos</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    /* Base pensada para un TV de 55" visto a varios metros. */
    html { font-size: 19px; }

    body {
      background: #05091f;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      color: rgba(255,255,255,0.88);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clock {
      font-size: 1.7rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      font-variant-numeric: tabular-nums;
    }

    /* ── Main grid ─────────────────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
    }

    .sin-datos {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: rgba(255,255,255,0.2);
      font-size: 1.5rem;
      font-weight: 300;
      gap: 16px;
    }
    .sin-datos .icon { font-size: 5rem; }

    .juegos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
      gap: 22px;
    }

    /* ── Tarjeta de juego — coloreada según --jc-* seteadas inline por juego,
       para distinguir cada juego de un vistazo (misma paleta que cola.js) ── */
    .juego-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--jc-border, rgba(255,255,255,0.1));
      border-top: 6px solid var(--jc-accent, rgba(255,255,255,0.3));
      border-radius: 18px;
      overflow: hidden;
    }
    .juego-header {
      background: var(--jc-bg, rgba(255,255,255,0.07));
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .juego-nombre {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--jc-text, rgba(255,255,255,0.9));
    }
    .juego-contadores {
      display: flex;
      gap: 8px;
    }
    .contador-badge {
      font-size: .85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .badge-activo  { background: rgba(59,130,246,0.35); color: #93c5fd; border: 1px solid rgba(59,130,246,0.5); }
    .badge-espera  { background: rgba(245,158,11,0.25); color: #fcd34d; border: 1px solid rgba(245,158,11,0.4); }

    .juego-body { padding: 18px 22px; }

    /* En juego */
    .seccion-label {
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 12px;
    }

    .turno-activo {
      background: var(--jc-bg, rgba(59,130,246,0.12));
      border: 1px solid var(--jc-border, rgba(59,130,246,0.25));
      border-left: 6px solid var(--jc-accent, #3b82f6);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .turno-activo.estado-llamado {
      background: rgba(245,158,11,0.12);
      border-color: rgba(245,158,11,0.3);
      border-left-color: #f59e0b;
    }
    .biper-tv {
      font-size: 2.9rem;
      font-weight: 900;
      color: var(--jc-accent, #93c5fd);
      line-height: 1;
      min-width: 58px;
      text-align: center;
    }
    .turno-activo.estado-llamado .biper-tv { color: #fcd34d; }
    .turno-info { flex: 1; }
    .turno-cliente {
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      margin-bottom: 6px;
    }
    .turno-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .meta-chip {
      font-size: .85rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 10px;
    }
    .chip-jugando { background: rgba(59,130,246,0.25); color: #93c5fd; }
    .chip-llamado { background: rgba(245,158,11,0.25); color: #fcd34d; }
    .chip-tiempo  { background: rgba(255,255,255,0.1);  color: rgba(255,255,255,0.6); }
    .chip-etapa   { background: rgba(139,92,246,0.25);  color: #c4b5fd; }

    /* Cola de espera */
    .divisor {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 16px 0;
    }

    .cola-lista { display: flex; flex-direction: column; gap: 8px; }
    .cola-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      border-left: 4px solid var(--jc-accent, rgba(255,255,255,0.15));
      border-radius: 8px;
      padding: 10px 14px;
    }
    .posicion {
      font-size: .95rem;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      min-width: 24px;
    }
    .biper-cola {
      font-size: 1.55rem;
      font-weight: 900;
      color: rgba(255,255,255,0.75);
      min-width: 42px;
    }
    .cola-cliente { font-size: 1.02rem; color: rgba(255,255,255,0.65); flex: 1; }
    .espera-chip {
      font-size: .85rem;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.08);
      padding: 3px 10px;
      border-radius: 10px;
    }
    .sin-cola { color: rgba(255,255,255,0.25); font-size: 1rem; padding: 4px 0; }
    .sin-activo { color: rgba(255,255,255,0.25); font-size: 1rem; padding: 4px 0; }

    /* Flash overlay */
    #flash {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: rgba(59,130,246,0.2);
      opacity: 0;
      transition: opacity .15s;
      z-index: 999;
    }
    #flash.show { opacity: 1; }

    /* Toast de turno cancelado */
    #toastCancelado {
      pointer-events: none;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #7f1d1d;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #toastCancelado.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Animación de nuevo elemento */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .nuevo { animation: slideIn .35s ease; }
  </style>
</head>
<body>

<div id="flash"></div>
<div id="toastCancelado"></div>

<header>
  <div class="brand"><i class="bi bi-controller"></i> Sistema de Turnos</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <div class="sin-datos" id="sinDatos">
    <div class="icon">&#128276;</div>
    <span>Sin actividad en este momento</span>
  </div>
  <div class="juegos-grid" id="juegosGrid" style="display:none"></div>
</main>

<link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="/js/pantalla.js"></script>
</body>
</html>
