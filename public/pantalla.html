<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla Operativa – Sistema de Turnos</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #05091f;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .clock {
      font-size: 1.5rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      font-variant-numeric: tabular-nums;
    }

    /* ── Main grid ─────────────────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 24px 28px;
      overflow-y: auto;
    }

    .sin-datos {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      color: rgba(255,255,255,0.2);
      font-size: 1.4rem;
      font-weight: 300;
      gap: 16px;
    }
    .sin-datos .icon { font-size: 5rem; }

    .juegos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    /* ── Tarjeta de juego ──────────────────────────────────────────────── */
    .juego-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      overflow: hidden;
    }
    .juego-header {
      background: rgba(255,255,255,0.07);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .juego-nombre {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
    }
    .juego-contadores {
      display: flex;
      gap: 8px;
    }
    .contador-badge {
      font-size: .75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .badge-activo  { background: rgba(59,130,246,0.35); color: #93c5fd; border: 1px solid rgba(59,130,246,0.5); }
    .badge-espera  { background: rgba(245,158,11,0.25); color: #fcd34d; border: 1px solid rgba(245,158,11,0.4); }

    .juego-body { padding: 16px 20px; }

    /* En juego */
    .seccion-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 10px;
    }

    .turno-activo {
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.25);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .turno-activo.estado-llamado {
      background: rgba(245,158,11,0.12);
      border-color: rgba(245,158,11,0.3);
    }
    .biper-tv {
      font-size: 2.4rem;
      font-weight: 900;
      color: #93c5fd;
      line-height: 1;
      min-width: 48px;
      text-align: center;
    }
    .turno-activo.estado-llamado .biper-tv { color: #fcd34d; }
    .turno-info { flex: 1; }
    .turno-cliente {
      font-size: .95rem;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      margin-bottom: 4px;
    }
    .turno-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .meta-chip {
      font-size: .72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .chip-jugando { background: rgba(59,130,246,0.25); color: #93c5fd; }
    .chip-llamado { background: rgba(245,158,11,0.25); color: #fcd34d; }
    .chip-tiempo  { background: rgba(255,255,255,0.1);  color: rgba(255,255,255,0.55); }
    .chip-etapa   { background: rgba(139,92,246,0.25);  color: #c4b5fd; }

    /* Cola de espera */
    .divisor {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 14px 0;
    }

    .cola-lista { display: flex; flex-direction: column; gap: 6px; }
    .cola-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .posicion {
      font-size: .8rem;
      font-weight: 700;
      color: rgba(255,255,255,0.3);
      min-width: 20px;
    }
    .biper-cola {
      font-size: 1.3rem;
      font-weight: 900;
      color: rgba(255,255,255,0.65);
      min-width: 36px;
    }
    .cola-cliente { font-size: .85rem; color: rgba(255,255,255,0.6); flex: 1; }
    .espera-chip {
      font-size: .7rem;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.07);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .sin-cola { color: rgba(255,255,255,0.2); font-size: .85rem; padding: 4px 0; }
    .sin-activo { color: rgba(255,255,255,0.2); font-size: .85rem; padding: 4px 0; }

    /* Flash overlay */
    #flash {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: rgba(59,130,246,0.2);
      opacity: 0;
      transition: opacity .15s;
      z-index: 999;
    }
    #flash.show { opacity: 1; }

    /* Animación de nuevo elemento */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .nuevo { animation: slideIn .35s ease; }
  </style>
</head>
<body>

<div id="flash"></div>

<header>
  <div class="brand">&#127931; Sistema de Turnos</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main>
  <div class="sin-datos" id="sinDatos">
    <div class="icon">&#128276;</div>
    <span>Sin actividad en este momento</span>
  </div>
  <div class="juegos-grid" id="juegosGrid" style="display:none"></div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/pantalla.js"></script>
</body>
</html>
