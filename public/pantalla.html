<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla Operativa – Sistema de Turnos</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    /* Base pensada para un TV de 55" visto a varios metros de distancia. */
    html { font-size: 19px; }

    body {
      background: radial-gradient(circle at 50% 50%, #0a1428 0%, #000507 100%);
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Fondo decorativo animado (Speed Park bg-fx) ──────────────────────── */
    .bg-fx { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    header, main, footer { position: relative; z-index: 1; }

    .energy-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .4; animation: pulse-glow 4s ease-in-out infinite; }
    .energy-left-1  { width:600px; height:600px; left:-200px; top:100px; background: radial-gradient(circle, rgba(255,45,0,.8) 0%, rgba(255,107,53,.3) 100%); animation-delay: 0s; }
    .energy-left-2  { width:800px; height:800px; left:0; bottom:-200px; background: radial-gradient(circle, rgba(255,45,0,.6) 0%, rgba(255,107,53,.2) 100%); animation-delay: 1s; }
    .energy-right-1 { width:700px; height:700px; right:-150px; top:50px; background: radial-gradient(circle, rgba(109,40,217,.9) 0%, rgba(168,85,247,.3) 100%); animation-delay: .5s; }
    .energy-right-2 { width:600px; height:600px; right:-100px; bottom:0; background: radial-gradient(circle, rgba(168,85,247,.7) 0%, rgba(109,40,217,.2) 100%); animation-delay: 1.5s; }
    @keyframes pulse-glow { 0%,100% { opacity:.3; transform:scale(1); } 50% { opacity:.6; transform:scale(1.05); } }

    .spark-line { position: absolute; opacity: 0; }
    .spark-line::before { content:''; position:absolute; background: linear-gradient(90deg, transparent, #ff6b35, transparent); animation: spark-flash 2s ease-in-out infinite; width:100%; height:100%; }
    .spark-left-1  { width:200px; height:3px; left:30px; top:150px; transform:rotate(-35deg); }
    .spark-left-1::before  { animation-delay: 0s; }
    .spark-left-2  { width:250px; height:3px; left:60px; top:450px; transform:rotate(20deg); }
    .spark-left-2::before  { animation-delay: .6s; }
    .spark-left-3  { width:220px; height:3px; left:40px; bottom:200px; transform:rotate(-25deg); }
    .spark-left-3::before  { animation-delay: 1.2s; }
    .spark-right-1 { width:200px; height:3px; right:50px; top:180px; transform:rotate(40deg); }
    .spark-right-1::before { background: linear-gradient(90deg, transparent, #a855f7, transparent); animation-delay: .3s; }
    .spark-right-2 { width:240px; height:3px; right:80px; top:500px; transform:rotate(-30deg); }
    .spark-right-2::before { background: linear-gradient(90deg, transparent, #6d28d9, transparent); animation-delay: .9s; }
    .spark-right-3 { width:210px; height:3px; right:60px; bottom:220px; transform:rotate(35deg); }
    .spark-right-3::before { background: linear-gradient(90deg, transparent, #a855f7, transparent); animation-delay: 1.5s; }
    @keyframes spark-flash { 0%,100% { opacity:0; } 50% { opacity:1; } }

    .particle { position:absolute; border-radius:50%; filter:blur(2px); box-shadow:0 0 10px currentColor; animation: float-up 6s ease-out infinite; }
    .particle-red     { color:#ff2d00; width:8px; height:8px; left:100px; bottom:-10px; animation-duration:5s; }
    .particle-orange  { color:#ff6b35; width:6px; height:6px; left:150px; bottom:-10px; animation-duration:6s; animation-delay:1s; }
    .particle-purple-1{ color:#a855f7; width:8px; height:8px; right:120px; bottom:-10px; animation-duration:5.5s; animation-delay:.5s; }
    .particle-purple-2{ color:#6d28d9; width:6px; height:6px; right:200px; bottom:-10px; animation-duration:6s; animation-delay:1.5s; }
    @keyframes float-up { 0% { opacity:0; transform:translateY(0) translateX(0); } 50% { opacity:1; } 100% { opacity:0; transform:translateY(-400px) translateX(50px); } }

    .sweep-line { position:absolute; height:2px; background: linear-gradient(90deg, transparent, rgba(168,85,247,.3), transparent); width:200%; animation: sweep 8s linear infinite; }
    .sweep-1 { top:25%; left:-50%; animation-delay:0s; }
    .sweep-2 { bottom:25%; right:-50%; background: linear-gradient(90deg, transparent, rgba(255,45,0,.3), transparent); animation: sweep-reverse 8s linear infinite; animation-delay:1s; }
    @keyframes sweep { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
    @keyframes sweep-reverse { 0% { transform:translateX(100%); } 100% { transform:translateX(-100%); } }

    .grid-overlay {
      position:absolute; width:100%; height:100%; opacity:.03;
      background-image:
        linear-gradient(0deg, transparent 24%, rgba(30,58,138,.5) 25%, rgba(30,58,138,.5) 26%, transparent 27%, transparent 74%, rgba(30,58,138,.5) 75%, rgba(30,58,138,.5) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(30,58,138,.5) 25%, rgba(30,58,138,.5) 26%, transparent 27%, transparent 74%, rgba(30,58,138,.5) 75%, rgba(30,58,138,.5) 76%, transparent 77%, transparent);
      background-size: 100px 100px;
    }

    /* ── Header ────────────────────────────────────────────────────────── */
    header {
      padding: 20px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .marca { display:flex; align-items:center; gap:14px; }
    .marca-icono {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .marca-nombre { font-size: 1.15rem; font-weight: 800; letter-spacing: .5px; color: rgba(255,255,255,.92); line-height:1.15; }

    .titulo-central { text-align: center; flex: 1; }
    .titulo-central h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }
    .titulo-central .subtitulo {
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #60a5fa;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .reloj-wrap { display:flex; align-items:center; gap:12px; }
    .reloj-wrap i { font-size: 1.5rem; color: rgba(255,255,255,.4); }
    .clock { font-size: 1.7rem; font-weight: 700; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }

    /* ── Main grid ─────────────────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 26px 32px;
      overflow-y: auto;
    }

    .sin-datos {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      color: rgba(255,255,255,0.2);
      font-size: 1.4rem;
      font-weight: 300;
      gap: 16px;
    }
    .sin-datos .icon { font-size: 5rem; }

    .juegos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
      gap: 20px;
    }

    /* ── Tarjeta de juego — coloreada según --jc-* seteadas inline por juego ── */
    .juego-card {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid var(--jc-border, rgba(255,255,255,0.15));
      border-top: 6px solid var(--jc-accent, rgba(255,255,255,0.3));
      border-radius: 18px;
      overflow: hidden;
    }
    .juego-header {
      background: var(--jc-bg, rgba(255,255,255,0.05));
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .juego-nombre {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--jc-text, rgba(255,255,255,0.9));
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .juego-contadores { display: flex; gap: 8px; }
    .contador-badge { font-size: .8rem; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
    .badge-activo  { background: rgba(59,130,246,0.35); color: #93c5fd; border: 1px solid rgba(59,130,246,0.5); }
    .badge-espera  { background: rgba(245,158,11,0.25); color: #fcd34d; border: 1px solid rgba(245,158,11,0.4); }

    .juego-body { padding: 16px 20px; }

    .seccion-label {
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 10px;
    }

    .turno-activo {
      position: relative;
      overflow: hidden;
      background: var(--jc-bg, rgba(59,130,246,0.1));
      border: 1px solid var(--jc-border, rgba(59,130,246,0.25));
      border-left: 6px solid var(--jc-accent, #3b82f6);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    /* Con foto del juego (--jc-img heredada de .juego-card): degradado oscuro
       encima para que el texto siga siendo legible. */
    .turno-activo.con-imagen {
      background:
        linear-gradient(100deg, rgba(6,10,28,.95) 0%, rgba(6,10,28,.88) 45%, rgba(6,10,28,.4) 75%, rgba(6,10,28,.1) 100%),
        var(--jc-img, none) center right / cover no-repeat,
        var(--jc-bg, rgba(59,130,246,0.1));
    }
    .turno-activo.estado-llamado {
      background: rgba(245,158,11,0.1);
      border-color: rgba(245,158,11,0.3);
      border-left-color: #f59e0b;
    }
    .turno-activo .icono-fondo {
      position: absolute; right:-10px; bottom:-14px;
      font-size: 4.5rem; color: var(--jc-accent, #3b82f6); opacity:.08; pointer-events:none;
    }
    .biper-tv {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--jc-accent, #93c5fd);
      line-height: 1;
      min-width: 52px;
      text-align: center;
    }
    .turno-activo.estado-llamado .biper-tv { color: #fcd34d; }
    .turno-info { flex: 1; }
    .turno-cliente {
      font-size: 1.1rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      margin-bottom: 6px;
    }
    .turno-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items:center; }
    .meta-chip { font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
    .chip-jugando { background: rgba(34,197,94,.16); color:#4ade80; }
    .chip-llamado { background: rgba(245,158,11,.16); color:#fbbf24; }
    .chip-tiempo  { background: rgba(255,255,255,0.08);  color: rgba(255,255,255,0.55); }
    .chip-etapa   { background: rgba(139,92,246,0.2);  color: #c4b5fd; }

    .divisor { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 14px 0; }

    .cola-lista { display: flex; flex-direction: column; gap: 8px; }
    .cola-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.035);
      border-left: 4px solid var(--jc-accent, rgba(255,255,255,0.2));
      border-radius: 10px;
      padding: 9px 14px;
    }
    .posicion { font-size: .9rem; font-weight: 700; color: rgba(255,255,255,0.35); min-width: 22px; }
    .biper-cola { font-size: 1.4rem; font-weight: 900; color: rgba(255,255,255,0.75); min-width: 40px; }
    .cola-cliente { font-size: .98rem; color: rgba(255,255,255,0.62); flex: 1; }
    .espera-chip {
      font-size: .82rem; font-weight: 700;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.07);
      padding: 3px 10px; border-radius: 10px;
    }
    .sin-cola { color: rgba(255,255,255,0.22); font-size: .95rem; padding: 4px 0; }
    .sin-activo { color: rgba(255,255,255,0.22); font-size: .95rem; padding: 4px 0; }

    /* ── Footer informativo ── */
    footer {
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      padding: 16px 36px;
      display: flex;
      justify-content: space-around;
      gap: 20px;
      flex-wrap: wrap;
    }
    .footer-item { display:flex; align-items:center; gap:14px; }
    .footer-item .icono {
      width: 40px; height: 40px; border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .footer-item:nth-child(1) .icono { background: rgba(59,130,246,.15); color:#60a5fa; }
    .footer-item:nth-child(2) .icono { background: rgba(250,204,21,.15); color:#facc15; }
    .footer-item:nth-child(3) .icono { background: rgba(249,115,22,.15); color:#fb923c; }
    .footer-item .texto .linea1 { font-size:.78rem; font-weight:700; letter-spacing:.5px; color: rgba(255,255,255,.6); text-transform:uppercase; }
    .footer-item .texto .linea2 { font-size:.95rem; font-weight:800; color: rgba(255,255,255,.95); }
    .footer-item:nth-child(1) .texto .linea2 { color:#93c5fd; }
    .footer-item:nth-child(3) .texto .linea2 { color:#fdba74; }

    /* Flash overlay */
    #flash {
      pointer-events:none;
      position: fixed;
      inset: 0;
      background: rgba(59,130,246,0.2);
      opacity: 0;
      transition: opacity .15s;
      z-index: 999;
    }
    #flash.show { opacity: 1; }

    /* Toast de turno cancelado */
    #toastCancelado {
      pointer-events:none;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #7f1d1d;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #toastCancelado.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .nuevo { animation: slideIn .35s ease; }

    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }
  </style>
</head>
<body>

<div class="bg-fx">
  <div class="energy-orb energy-left-1"></div>
  <div class="energy-orb energy-left-2"></div>
  <div class="energy-orb energy-right-1"></div>
  <div class="energy-orb energy-right-2"></div>
  <div class="spark-line spark-left-1"></div>
  <div class="spark-line spark-left-2"></div>
  <div class="spark-line spark-left-3"></div>
  <div class="spark-line spark-right-1"></div>
  <div class="spark-line spark-right-2"></div>
  <div class="spark-line spark-right-3"></div>
  <div class="particle particle-red"></div>
  <div class="particle particle-orange"></div>
  <div class="particle particle-purple-1"></div>
  <div class="particle particle-purple-2"></div>
  <div class="sweep-line sweep-1"></div>
  <div class="sweep-line sweep-2"></div>
  <div class="grid-overlay"></div>
</div>
<div id="flash"></div>
<div id="toastCancelado"></div>

<header>
  <div class="marca">
    <div class="marca-icono"><i class="bi bi-controller"></i></div>
    <div class="marca-nombre">UNIVERSALL<br>ENTRETENIMIENTOS</div>
  </div>
  <div class="titulo-central">
    <h1>SISTEMA DE TURNOS</h1>
    <div class="subtitulo">Estado en vivo</div>
  </div>
  <div class="reloj-wrap">
    <i class="bi bi-clock"></i>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<main>
  <div class="sin-datos" id="sinDatos">
    <div class="icon">&#128276;</div>
    <span>Sin actividad en este momento</span>
  </div>
  <div class="juegos-grid" id="juegosGrid" style="display:none"></div>
</main>

<footer>
  <div class="footer-item">
    <div class="icono"><i class="bi bi-info-circle-fill"></i></div>
    <div class="texto">
      <div class="linea1">Los tiempos son</div>
      <div class="linea2">Estimados</div>
    </div>
  </div>
  <div class="footer-item">
    <div class="icono"><i class="bi bi-star-fill"></i></div>
    <div class="texto">
      <div class="linea1">¡Gracias por elegirnos!</div>
      <div class="linea2">Que te diviertas</div>
    </div>
  </div>
  <div class="footer-item">
    <div class="icono"><i class="bi bi-ticket-perforated-fill"></i></div>
    <div class="texto">
      <div class="linea1">¿Ya tenés tu turno?</div>
      <div class="linea2">Preparate y que comience la diversión</div>
    </div>
  </div>
</footer>

<link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<script src="/js/pantalla.js"></script>
</body>
</html>
